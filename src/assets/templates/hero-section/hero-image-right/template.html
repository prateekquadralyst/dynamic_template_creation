<section class="hero-image-right">
    <div class="hero-container">
      <div class="hero-text-column">
        <span class="hero-tagline">Introducing</span>
        <h1 class="hero-heading">{{headerText}}</h1>
        <p class="hero-description">{{heroSubheading}}</p>
        <div class="hero-cta">
          <button class="btn-primary">
            <span>Get Started</span>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="icon-arrow">
              <path fill-rule="evenodd" d="M12.293 5.293a1 1 0 011.414 0l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-2.293-2.293a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
          </button>
          <button class="btn-text">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="icon-play">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />
            </svg>
            <span>Watch Demo</span>
          </button>
        </div>
        <div class="hero-users">
          <div class="user-avatars">
            <div class="avatar"></div>
            <div class="avatar"></div>
            <div class="avatar"></div>
            <div class="avatar"></div>
          </div>
          <p class="user-text">Joined by 10,000+ users</p>
        </div>
      </div>
      <div class="hero-image-column">
        <div class="image-wrapper">
          <img src="{{imageUrl}}" alt="Hero Image" class="hero-image">
        </div>
        <div class="shape-1"></div>
        <div class="shape-2"></div>
      </div>
    </div>
  </section>
